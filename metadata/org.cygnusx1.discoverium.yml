Summary: Discover and update Android apps from their original sources
Description: |
  Discoverium lets you discover Android apps and receive updates directly
  from their original release sources. This repository republishes the
  official APK release and does not rebuild or modify the application.

  APKs are downloaded from the official Discoverium GitHub releases.
